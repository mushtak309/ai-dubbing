<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0d1117; color: #fff; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { color: #58a6ff; font-size: 20px; margin: 10px 0; }
    .frame-box { width: 100%; max-width: 600px; height: 82vh; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; background: #161b22; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <h1>AI Video Studio</h1>
  <div class="frame-box">
    <iframe src="https://dezgo.com/text2video" allow="fullscreen"></iframe>
  </div>
</body>
</html>
