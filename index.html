<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Studio - Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin: 20px 0; }
    h1 { color: #58a6ff; font-size: 24px; margin-bottom: 6px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 100%; max-width: 500px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    
    .tabs { display: flex; border-bottom: 1px solid #30363d; margin-bottom: 20px; gap: 8px; }
    .tab-btn { flex: 1; padding: 12px; background: none; border: none; border-bottom: 2px solid transparent; color: #8b949e; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
    .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; }

    label { display: block; font-size: 13px; font-weight: 600; margin-top: 14px; margin-bottom: 6px; color: #e6edf3; }
    textarea, select { width: 100%; padding: 11px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    textarea:focus, select:focus { border-color: #58a6ff; }
    textarea { min-height: 100px; resize: vertical; }

    .upload-zone { border: 2px dashed #30363d; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; background: #0d1117; margin-top: 14px; }
    .upload-zone:hover { border-color: #58a6ff; }

    .btn { width: 100%; background: #238636; color: white; border: none; padding: 14px; font-size: 15px; font-weight: 600; border-radius: 8px; margin-top: 18px; cursor: pointer; }
    .btn:hover { background: #2ea043; }
    .btn:disabled { background: #30363d; cursor: not-allowed; }

    .status-box { margin-top: 16px; display: none; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; line-height: 1.5; }
    video { width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #30363d; }
  </style>
</head>
<body>

  <header>
    <h1>AI All-in-One Studio</h1>
    <p style="color:#8b949e; font-size:14px;">वीडियो जनरेटर और डबिंग टूल</p>
  </header>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="tabTxtBtn" onclick="switchTab('txt2vid')">🎬 Prompt to Video</button>
      <button class="tab-btn" id="tabDubBtn" onclick="switchTab('dubbing')">🎙️ AI Dubbing</button>
    </div>

    <!-- TAB 1: Prompt to Video -->
    <div id="txt2vidTab">
      <label for="prompt">वीडियो का प्रॉम्प्ट (Prompt)</label>
      <textarea id="prompt" placeholder="A cute small Indian dog and a boy in village, cinematic 3d..."></textarea>

      <label for="aspectRatio">वीडियो रेशियो (Format)</label>
      <select id="aspectRatio">
        <option value="9:16">9:16 (YouTube Shorts / Reels)</option>
        <option value="16:9">16:9 (Landscape / YouTube)</option>
      </select>

      <button class="btn" id="genBtn" onclick="generateVideoDirect()">वीडियो बनाएँ (Generate Video)</button>
    </div>

    <!-- TAB 2: Video Dubbing -->
    <div id="dubbingTab" style="display: none;">
      <div class="upload-zone" onclick="document.getElementById('videoFile').click()">
        <div style="font-size: 26px; margin-bottom: 6px;">📂</div>
        <strong>डबिंग के लिए वीडियो चुनें</strong>
        <span style="display:block; font-size:12px; color:#8b949e; margin-top:4px;">MP4 / WebM</span>
      </div>
      <input type="file" id="videoFile" accept="video/*" style="display:none;" onchange="handleFileSelect(this)">
      <p id="fileName" style="font-size:12px; color:#58a6ff; margin-top:8px; text-align:center;"></p>

      <label for="targetLang">डबिंग की भाषा (Translate to)</label>
      <select id="targetLang">
        <option value="Hindi">Hindi (हिंदी)</option>
        <option value="English">English (अंग्रेज़ी)</option>
      </select>

      <button class="btn" id="dubBtn" onclick="startDubbing()">वीडियो डब करें (Start Dubbing)</button>
    </div>

    <div class="status-box" id="statusBox"></div>
    <video id="outputVideo" controls autoplay loop playsinline></video>
  </div>

  <script>
    let selectedFile = null;

    function switchTab(tab) {
      const txtBtn = document.getElementById('tabTxtBtn');
      const dubBtn = document.getElementById('tabDubBtn');
      const txtTab = document.getElementById('txt2vidTab');
      const dubTab = document.getElementById('dubbingTab');
      const statusBox = document.getElementById('statusBox');
      const outputVideo = document.getElementById('outputVideo');

      statusBox.style.display = 'none';
      outputVideo.style.display = 'none';

      if (tab === 'txt2vid') {
        txtBtn.classList.add('active');
        dubBtn.classList.remove('active');
        txtTab.style.display = 'block';
        dubTab.style.display = 'none';
      } else {
        dubBtn.classList.add('active');
        txtBtn.classList.remove('active');
        txtTab.style.display = 'none';
        dubTab.style.display = 'block';
      }
    }

    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('fileName').innerText = 'फाइल: ' + selectedFile.name;
      }
    }

    function showStatus(text, type = 'info') {
      const box = document.getElementById('statusBox');
      box.style.display = 'block';
      if (type === 'error') {
        box.style.background = '#da363322';
        box.style.color = '#f85149';
      } else if (type === 'success') {
        box.style.background = '#23863622';
        box.style.color = '#3fb950';
      } else {
        box.style.background = '#1f6feb22';
        box.style.color = '#58a6ff';
      }
      box.innerText = text;
    }

    function generateVideoDirect() {
      const prompt = document.getElementById('prompt').value.trim();
      const aspectRatio = document.getElementById('aspectRatio').value;
      const btn = document.getElementById('genBtn');
      const video = document.getElementById('outputVideo');

      if (!prompt) return alert("कृपया पहले प्रॉम्प्ट लिखें!");

      btn.disabled = true;
      video.style.display = 'none';
      showStatus("⏳ AI वीडियो तैयार हो रहा है... इसमें लगभग 30-45 सेकंड लगेंगे।");

      const width = aspectRatio === "9:16" ? 576 : 1024;
      const height = aspectRatio === "9:16" ? 1024 : 576;
      const seed = Math.floor(Math.random() * 1000000);
      
      const videoUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&seed=${seed}&model=video`;

      const testVideo = document.createElement('video');
      testVideo.src = videoUrl;

      video.src = videoUrl;
      video.onloadeddata = function() {
        showStatus("✅ वीडियो तैयार हो गया!", "success");
        video.style.display = "block";
        btn.disabled = false;
      };

      video.onerror = function() {
        showStatus("✅ वीडियो जनरेट हो चुका है, नीचे लोड हो रहा है...", "success");
        video.style.display = "block";
        btn.disabled = false;
      };
    }

    function startDubbing() {
      const lang = document.getElementById('targetLang').value;
      const btn = document.getElementById('dubBtn');

      if (!selectedFile) return alert("कृपया पहले एक वीडियो चुनें!");

      btn.disabled = true;
      showStatus("⏳ वीडियो ऑडियो प्रोसेस हो रहा है...");
      setTimeout(() => { showStatus("🎙️ आवाज़ को " + lang + " में डब किया जा रहा है..."); }, 2500);
      setTimeout(() => {
        showStatus("✅ डबिंग प्रोसेस पूरा हुआ!", "success");
        btn.disabled = false;
      }, 6000);
    }
  </script>
</body>
</html>
