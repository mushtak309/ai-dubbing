<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #0d1117; color: #fff; padding: 12px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { text-align: center; margin: 10px 0 15px; }
    h1 { color: #58a6ff; font-size: 22px; }
    p { color: #8b949e; font-size: 13px; margin-top: 4px; }
    .frame-card { width: 100%; max-width: 650px; height: 85vh; border-radius: 12px; overflow: hidden; border: 1px solid #30363d; background: #161b22; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <header>
    <h1>AI Video Studio</h1>
    <p>प्रॉम्प्ट लिखें और सीधे यहाँ वीडियो तैयार करें</p>
  </header>

  <div class="frame-card">
    <iframe 
      src="https://damo-vilab-modelscope-text-to-video-synthesis.hf.space"
      allow="accelerometer; ambient-light-sensor; camera; encrypted-media; geolocation; gyroscope; hid; microphone; midi; payment; usb; vr; xr-spatial-tracking"
      sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads">
    </iframe>
  </div>
</body>
</html>
