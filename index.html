<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dubbing Studio</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-top: 20px; margin-bottom: 30px; }
    h1 { color: #58a6ff; font-size: 26px; margin-bottom: 8px; }
    p.subtitle { color: #8b949e; font-size: 14px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .upload-zone { border: 2px dashed #30363d; border-radius: 8px; padding: 30px 15px; text-align: center; cursor: pointer; margin-bottom: 20px; background: #0d1117; }
    .upload-zone:hover { border-color: #58a6ff; }
    .upload-zone span { display: block; font-size: 13px; color: #8b949e; margin-top: 6px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #e6edf3; }
    select, input[type="file"] { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; margin-bottom: 16px; outline: none; }
    select:focus { border-color: #58a6ff; }
    .btn { width: 100%; background: #238636; color: white; border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #2ea043; }
    .status-box { margin-top: 20px; display: none; padding: 14px; border-radius: 6px; background: #1f242c; font-size: 13px; text-align: center; border: 1px solid #388bfd33; color: #58a6ff; }
  </style>
</head>
<body>

  <header>
    <h1>AI Video Dubbing Studio</h1>
    <p class="subtitle">अपनी वीडियो को किसी भी भाषा में डब करें और लिप-सिंक बनाएँ</p>
  </header>

  <div class="card">
    <div class="upload-zone" onclick="document.getElementById('videoInput').click()">
      <div style="font-size: 32px; margin-bottom: 8px;">📹</div>
      <strong>वीडियो चुनें या यहाँ खींचें</strong>
      <span>MP4, WebM (अधिकतम 50MB)</span>
    </div>
    <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="updateFileName(this)">
    <p id="fileName" style="font-size: 12px; color: #58a6ff; margin-bottom: 14px; text-align: center;"></p>

    <label for="sourceLang">मूल भाषा (Original Language)</label>
    <select id="sourceLang">
      <option value="auto">Auto Detect (स्वतः पहचानें)</option>
      <option value="hi">Hindi (हिंदी)</option>
      <option value="en">English (अंग्रेज़ी)</option>
    </select>

    <label for="targetLang">डबिंग की भाषा (Translate to)</label>
    <select id="targetLang">
      <option value="en">English</option>
      <option value="hi">Hindi</option>
      <option value="es">Spanish</option>
      <option value="ar">Arabic</option>
      <option value="fr">French</option>
      <option value="de">German</option>
    </select>

    <label for="voiceStyle">आवाज़ का प्रकार (Voice Model)</label>
    <select id="voiceStyle">
      <option value="clone">Clone Original Voice (मूल आवाज़ जैसी)</option>
      <option value="male">Studio Voice (Male)</option>
      <option value="female">Studio Voice (Female)</option>
    </select>

    <button class="btn" onclick="startDubbing()">वीडियो डब करें (Start Dubbing)</button>

    <div class="status-box" id="statusBox"></div>
  </div>

  <script>
    function updateFileName(input) {
      if (input.files && input.files[0]) {
        document.getElementById('fileName').innerText = 'चुनी गई फ़ाइल: ' + input.files[0].name;
      }
    }

    function startDubbing() {
      const file = document.getElementById('videoInput').files[0];
      const statusBox = document.getElementById('statusBox');
      if (!file) {
        alert('कृपया पहले एक वीडियो चुनें!');
        return;
      }
      statusBox.style.display = 'block';
      statusBox.innerHTML = '⏳ वीडियो प्रोसेस हो रहा है... (ऑडियो अलग किया जा रहा है और ट्रांसलेशन जारी है)';
    }
  </script>

</body>
</html>
