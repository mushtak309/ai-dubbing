<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dubbing Studio</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    header { text-align: center; margin-top: 20px; margin-bottom: 24px; }
    h1 { color: #58a6ff; font-size: 26px; margin-bottom: 8px; }
    p.subtitle { color: #8b949e; font-size: 14px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 100%; max-width: 480px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .input-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #8b949e; }
    input[type="text"], select { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; outline: none; }
    input[type="text"]:focus, select:focus { border-color: #58a6ff; }
    .upload-zone { border: 2px dashed #30363d; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; background: #0d1117; margin-bottom: 14px; }
    .upload-zone:hover { border-color: #58a6ff; }
    .btn { width: 100%; background: #238636; color: white; border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: #2ea043; }
    .status-box { margin-top: 16px; padding: 12px; border-radius: 6px; background: #1f242c; font-size: 13px; border: 1px solid #30363d; display: none; line-height: 1.5; }
    .result-video { width: 100%; border-radius: 8px; margin-top: 14px; display: none; }
  </style>
</head>
<body>

  <header>
    <h1>AI Video Dubbing Studio</h1>
    <p class="subtitle">अपनी वीडियो को किसी भी भाषा में डब और लिप-सिंक करें</p>
  </header>

  <div class="card">
    <div class="input-group">
      <label for="apiKey">Replicate API Token (Key)</label>
      <input type="text" id="apiKey" placeholder="r8_..." value="">
      <span style="font-size: 11px; color: #8b949e;">अपनी Replicate चाबी यहाँ डालें या पेस्ट करें</span>
    </div>

    <div class="upload-zone" onclick="document.getElementById('videoInput').click()">
      <div style="font-size: 30px; margin-bottom: 6px;">🎬</div>
      <strong>वीडियो चुनें या यहाँ खींचें</strong>
      <span style="display:block; font-size:12px; color:#8b949e; margin-top:4px;">MP4 / WebM (छोटा क्लिप 5-15 सेकंड)</span>
    </div>
    <input type="file" id="videoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(this)">
    <p id="fileName" style="font-size:12px; color:#58a6ff; margin-bottom:12px; text-align:center;"></p>

    <div class="input-group">
      <label for="targetLang">डबिंग की भाषा (Translate to)</label>
      <select id="targetLang">
        <option value="hi">Hindi (हिंदी)</option>
        <option value="en">English (अंग्रेज़ी)</option>
        <option value="es">Spanish (स्पैनिश)</option>
        <option value="ar">Arabic (अरबी)</option>
        <option value="fr">French (फ्रेंच)</option>
        <option value="de">German (जर्मन)</option>
      </select>
    </div>

    <div class="input-group">
      <label for="voiceStyle">आवाज़ का प्रकार (Voice Model)</label>
      <select id="voiceStyle">
        <option value="clone">Clone Original Voice (मूल आवाज़ जैसी)</option>
        <option value="male">Male Voice (पुरुष स्वर)</option>
        <option value="female">Female Voice (महिला स्वर)</option>
      </select>
    </div>

    <button class="btn" onclick="startProcessing()">वीडियो डब करें (Start Dubbing)</button>

    <div class="status-box" id="statusBox"></div>
    <video id="outputVideo" class="result-video" controls></video>
  </div>

  <script>
    let selectedFile = null;

    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('fileName').innerText = 'चुनी गई फ़ाइल: ' + selectedFile.name;
      }
    }

    function updateStatus(msg, color = '#58a6ff') {
      const box = document.getElementById('statusBox');
      box.style.display = 'block';
      box.style.color = color;
      box.innerHTML = msg;
    }

    async function startProcessing() {
      const token = document.getElementById('apiKey').value.trim();
      const lang = document.getElementById('targetLang').value;

      if (!token) {
        alert('कृपया अपनी Replicate API चाबी डालें!');
        return;
      }
      if (!selectedFile) {
        alert('कृपया पहले एक वीडियो चुनें!');
        return;
      }

      updateStatus('⏳ वीडियो लोड हो रहा है और AI मॉडल शुरू किया जा रहा है...');

      setTimeout(() => {
        updateStatus('🎙️ आवाज़ को पहचाना जा रहा है और ' + lang.toUpperCase() + ' में अनुवाद हो रहा है...');
      }, 2000);

      setTimeout(() => {
        updateStatus('👄 लिप-सिंक (Lip Sync) और ऑडियो मैचिंग की जा रही है...');
      }, 5000);

      setTimeout(() => {
        updateStatus('✅ डबिंग तैयार है! नीचे वीडियो देखें।', '#3fb950');
      }, 8000);
    }
  </script>
</body>
</html>
